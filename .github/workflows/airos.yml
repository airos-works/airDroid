# Builds the air/OS package (x86_64: airDroid needs NVMM) on every push to
# main and publishes it to the rolling "latest" release; the image builds
# take it from the package pool. The pipeline lives in airos-works/airos-ci
# (apps/build-app-packages.sh, build_airdroid).
name: air/OS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  airos:
    uses: airos-works/airos-ci/.github/workflows/app.yml@main
    with:
      app: airdroid
      repo-dir: airDroid
      architectures: x86_64
    permissions:
      contents: write
