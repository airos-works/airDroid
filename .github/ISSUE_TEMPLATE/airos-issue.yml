name: "Report a problem with airDroid"
description: "Something in airDroid does not work as expected on airOS."
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with airDroid on airOS. A short, specific report is the most useful: what you did, what happened and what you expected.

        Please [search the existing issues](https://github.com/airos-works/airDroid/issues?q=is%3Aissue) first, and leave out passwords, keys and personal details, including in logs and screenshots.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A brief description of the problem. Include the steps that lead to it, what you expected and what happened instead.
      placeholder: |
        1. Install … (an .apk or an app bundle: .apkm, .xapk, .apks)
        2. Open it from Deskbar › Applications › Android apps

        Expected: …
        Instead: …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Hardware platform
      description: The kind of machine you saw the problem on.
      options:
        - "x86-64 desktop PC"
        - "x86-64 laptop"
        - "Framework Laptop 13"
        - "Radxa ROCK 5 ITX"
        - "Radxa Dragon Q8B"
        - "Raspberry Pi 4"
        - "Radxa Cubie A7S"
        - "Other ARM64 machine (UEFI)"
        - "Virtual machine (QEMU, VirtualBox, VMware, …)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and airOS details
      description: |
        The machine or board model, processor, graphics, memory and any devices involved (a USB adapter, a display, a Wi-Fi card). For a driver problem, the matching lines from `listdev` (PCI) or `listusb` (USB) in Terminal help.

        Which airOS you are running: paste the output of `cat /boot/system/data/airos/release`, or the name of the image you installed from.
      placeholder: |
        Machine: …
        Processor and graphics: …
        Memory: …
        airOS release: …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "airDroid version"
      description: From the app's About window, or the package file name (for example `airdroid-0.1.0-199-x86_64.hpkg`). Say if it came with the airOS image.
    validations:
      required: false
  - type: input
    id: android-app
    attributes:
      label: Android app
      description: For a problem with one Android app, its name and version, and where the file came from (for example `Reddit 2026.46.0, .apkm from APKMirror`).
    validations:
      required: false
  - type: textarea
    id: files
    attributes:
      label: Crash reports, logs and screenshots
      description: |
        Drag files into this box to attach them, or paste short logs as text. Useful files:

        - **Crash report**: when an app crashes, choose **Save report** in the dialog that appears. The `.report` file is saved on your Desktop.
        - **System log**: `/var/log/syslog`, especially for hardware, driver and start-up problems. Attach it soon after the problem happens.
        - **Android's log**: `airdroid logcat -d > ~/Desktop/logcat.txt` in Terminal, soon after the problem happens, while Android is still running.
        - **The VM's console and QEMU's log**: `~/config/cache/airDroid/console.log` and `~/config/cache/airDroid/qemu.log`, for problems starting Android.
        - **Screenshots or a short screen recording**: press Print Screen, or use AirShot.
      placeholder: Drag and drop files here.
    validations:
      required: false
