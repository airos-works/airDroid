[workspace]
resolver = "2"
members = ["crates/proto", "crates/guest", "crates/core", "crates/devtool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/airos-works/airDroid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
debug = false
